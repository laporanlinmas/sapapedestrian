    <!-- ═══════════════════════════════════════════════════════════════════
     ASET HERO — DIMUAT DI AWAL, SEBELUM JAVASCRIPT
     ═══════════════════════════════════════════════════════════════════
     Hero adalah yang pertama dilihat, jadi dua aset ini harus diminta lebih
     awal dari apa pun — bukan menunggu React mount dulu.

       · hero-petugas-poster.webp (33 KB) → petugas langsung terlihat.
         Yang animasi (±1,3 MB) sengaja TIDAK di-preload: memaksa 1,3 MB
         mendahului JS akan menunda judul dan justru memperlambat LCP. File itu
         tetap diambil lewat `requestIdleCallback` setelah 4 detik.
       · 360.webp (840 KB) → latar panorama, isi hero yang paling besar.
         Kanvasnya sudah menggambar gradien tema selama menunggu, jadi tidak
         ada kedipan; begitu file ini sampai, hero bertransisi mulus ke foto.

     Kenapa di-inject lewat skrip, bukan `<link rel="preload">` biasa?

     Karena `<link>` statis tidak bisa membaca `navigator.connection.saveData`.
     Script ini berjalan di dalam `<head>` — jauh sebelum body di-parse, jadi
     tetap "paling awal" — tetapi ia TIDAK preload apa pun kalau pengguna
     menyalakan Save-Data. Tanpa pengecekan ini, panorama 840 KB justru turun juga
     ke pengguna yang justru meminta hemat data; komponennya sudah menahan
     unduhan itu, dan preload akan membatalkannya.

     Blok ini sengaja ditaruh SEKARANG, di anak pertama `<head>` — parser
    _app_nya tinggal beberapa byte sebelum preload masuk, jadi antrean unduhan
     tidak tertunda oleh tag favicon di bawahnya.

     Nol request tambahan: skrip inline, nol dependensi.

     Ketiganya sudah diberi header cache jangka panjang di vercel.json, jadi
     kunjungan berikutnya tidak mengunduh ulang sama sekali.
     ═══════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        try {
          var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
          if (c.saveData) return;                 /* Save-Data: jangan sentuh bandwidth */
          var src = ['/assets/hero-petugas-poster.webp', '/assets/360.webp'];
          for (var i = 0; i < src.length; i++) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.type = 'image/webp';
            l.href = src[i];
            l.fetchPriority = 'high';
            document.head.appendChild(l);
          }
        } catch (e) { /* preload hanya bonus; kalau gagal, hero tetap jalan */ }
      })();
    </script>
